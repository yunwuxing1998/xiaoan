<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小安的手术配合知识库</title>
  <meta name="description" content="手术室护士的手术配合知识库，涵盖各专科手术配合要点、专家习惯、器械图谱与手术视频。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="小安的手术配合知识库" />
  <meta property="og:description" content="手术室护士的手术配合知识库，涵盖各专科手术配合要点、专家习惯、器械图谱与手术视频。" />
  <meta property="og:image" content="https://yunwuxing1998.github.io/xiaoan/og-image.png" />
  <meta property="og:url" content="https://yunwuxing1998.github.io/xiaoan/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#15788a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="手术配合知识库" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="shell header-inner">
      <button class="menu-btn" id="menuBtn" aria-label="打开目录">☰</button>
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">🩺</span>
        <span class="brand-copy">
          <strong id="brandTitle">小安的手术配合知识库</strong>
          <small>Surgical Nursing</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#/" id="navHome">资料目录</a>
      </nav>
    </div>
  </header>

  <main id="main-content">

    <!-- ======== 首页：科别卡片 ======== -->
    <section id="home">
      <section class="page-hero">
        <div class="shell">
          <p class="eyebrow">Surgical Registry</p>
          <h1 id="heroTitle">手术配合资料目录</h1>
          <p class="lede" id="heroLede"></p>
        </div>
      </section>

      <section class="dept-section shell">
        <div class="dept-section-title">按专科浏览</div>
        <div class="dept-grid" id="deptGrid"></div>
        <div class="qr-panel">
          <img class="qr-img" src="qr-code.svg" alt="知识库二维码" width="140" height="140" />
          <div class="qr-copy">
            <strong>手机扫码访问</strong>
            <span>微信扫一扫，随时查阅手术配合要点。<br />也可在浏览器中打开后「添加到主屏幕」，使用更方便。</span>
          </div>
        </div>
        <div class="disclaimer">
          <strong>⚠️ 使用提示</strong>
          本知识库为个人临床经验整理，仅供手术室配合参考与学习，不能替代医疗规范与医嘱。具体手术配合请以所在医院的操作规程为准。
        </div>
      </section>
    </section>

    <!-- ======== 科别详情页 ======== -->
    <section id="deptDetail" hidden>
      <div class="dept-detail shell">
        <a class="back-link" href="#/">← 返回资料目录</a>
        <header class="dept-detail-header" id="deptHeader"></header>
        <div class="detail-filters">
          <input type="search" id="deptSearch" placeholder="搜索该科别下的内容…" autocomplete="off" />
          <select id="deptTypeFilter"><option value="">全部类型</option></select>
        </div>
        <div id="deptList" class="subpage-list"></div>
        <div id="deptEmpty" class="empty-state" hidden>
          <h2>没有找到相关内容</h2>
          <p>换个关键词试试。</p>
        </div>
      </div>
    </section>

    <!-- ======== 文章页 ======== -->
    <section id="pageView" hidden>
      <div class="shell article-layout">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-head">资料目录</div>
          <nav id="nav" class="nav"></nav>
        </aside>
        <article class="article" id="article"></article>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <div class="footer-brand">
        <span class="brand-mark" aria-hidden="true">🩺</span>
        <div>
          <strong>小安的手术配合知识库</strong>
          <small>手术室护士 · 手术配合速查手册</small>
        </div>
      </div>
      <p class="footer-note" id="footerNote"></p>
    </div>
  </footer>

  <!-- ======== 移动端全局目录抽屉 ======== -->
  <aside class="mobile-drawer" id="mobileDrawer" aria-label="移动端目录">
    <div class="mobile-drawer-head">资料目录</div>
    <nav id="mobileNav" class="nav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
